services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema_booking_app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Ho_Chi_Minh -Xms512m -Xmx1024m
      # Cấu hình VNPay (mặc định đã có sandbox key trong VNPayConfig.java)
      - VNP_PAY_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VNP_TMN_CODE=NWGUE67R
      - VNP_HASH_SECRET=ETJHJUGEBCXYVPFFBVMIFRCVNJCNIFMO
      # Cấu hình SMTP gửi mail vé (điền tài khoản Gmail App Password nếu cần)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASSWORD=
    restart: unless-stopped

